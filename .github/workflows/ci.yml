name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # release tags, for the regression check
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install system tools (pdftoppm, xmllint)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils libxml2-utils
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the app (checks the artifact contract)
        run: npm run build
      - name: Score against the test corpus (no OCR)
        run: npm test
      # Regression gates against the last release (ship first, then test): the benchmark read with
      # OCR as the page reads (eng+deu and the second pass, each side with its own OCR models) and
      # the challenge set without OCR. Either fails the job on a regression (aggregate, any item,
      # crashes, or notation elements no longer written); both reports go to the job summary.
      - name: Regression gate - benchmark with OCR
        run: |
          s=0; node tools/regress.mjs --ocr --jobs 4 --out mvp/work/regress-ci-ocr.md || s=$?
          [ -f mvp/work/regress-ci-ocr.md ] && cat mvp/work/regress-ci-ocr.md >> "$GITHUB_STEP_SUMMARY"
          exit $s
      - name: Regression gate - challenge set
        if: ${{ !cancelled() }}
        run: |
          s=0; node tools/regress.mjs --set challenge --jobs 4 --out mvp/work/regress-ci-challenge.md || s=$?
          [ -f mvp/work/regress-ci-challenge.md ] && cat mvp/work/regress-ci-challenge.md >> "$GITHUB_STEP_SUMMARY"
          exit $s
      - name: Browser test (Chromium)
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: score-scan-reader-ci
          path: |
            mvp/dist/
            mvp/work/eval-ci.json
            mvp/work/regress-ci-*.md
