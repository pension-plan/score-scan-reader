<div class="wrap">
  <header>
    <h1>Score Scan Reader</h1>
    <p>Scanned sheet music (PDF or image) to MusicXML 4.0, with lyrics and SATB voices split into parts. Runs entirely in your browser.</p>
  </header>
  <div class="drop" id="drop">
    <label class="btn" for="file">Choose PDF or image</label>
    <input id="file" type="file" accept="application/pdf,image/png,image/jpeg" hidden>
    <button class="btn ghost" id="sample" type="button">Reload sample hymn</button>
    <span id="status">Loading...</span>
  </div>
  <div class="grid">
    <section class="card">
      <h2>Detection</h2>
      <div class="legend" id="legend"></div>
      <div id="pages"></div>
    </section>
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <section class="card"><h2>Parts</h2><div id="parts" class="muted">-</div></section>
      <section class="card"><h2>Lyrics</h2><div id="lyrics" class="lyr muted">-</div></section>
      <section class="card"><h2>Warnings</h2><ul class="warn" id="warnings"></ul></section>
    </div>
    <section class="card full">
      <div class="row"><h2 class="grow" style="margin:0">MusicXML 4.0</h2><span id="copied"></span><button class="btn" id="copy" type="button">Copy</button></div>
      <textarea id="xml" spellcheck="false" readonly></textarea>
    </section>
    <section class="card full"><h2>Notation preview</h2><div id="osmd"></div><p class="muted" id="osmdNote"></p></section>
  </div>
</div>
